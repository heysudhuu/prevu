<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2b"/>
      <stop offset="50%" stop-color="#09090d"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </linearGradient>
    <linearGradient id="prevu-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#8b5cf6" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Glowing background orb -->
  <circle cx="256" cy="256" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>

  <!-- Prevu 'P' / Paper Symbol -->
  <g transform="translate(136, 116)" filter="url(#glow)">
    <!-- Document Fold -->
    <path d="M40 0 H180 L240 60 V260 C240 271 231 280 220 280 H40 C29 280 20 271 20 260 V20 C20 9 29 0 40 0 Z" fill="none" stroke="url(#prevu-grad)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Fold Corner -->
    <path d="M180 0 V60 H240" fill="none" stroke="url(#prevu-grad)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Inner Sparkle -->
    <path d="M130 110 L140 145 L175 155 L140 165 L130 200 L120 165 L85 155 L120 145 Z" fill="url(#prevu-grad)"/>

    <!-- Document Lines -->
    <line x1="65" y1="90" x2="135" y2="90" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    <line x1="65" y1="220" x2="195" y2="220" stroke="#a855f7" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
